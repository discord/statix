name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - otp: "24"
            elixir: "1.15"
            runtime_config: true
          - otp: "24"
            elixir: "1.15"
            runtime_config: false
          - otp: "25"
            elixir: "1.15"
            runtime_config: true
          - otp: "25"
            elixir: "1.15"
            runtime_config: false
          - otp: "25"
            elixir: "1.18"
            runtime_config: true
          - otp: "25"
            elixir: "1.18"
            runtime_config: false
          - otp: "28"
            elixir: "1.18"
            runtime_config: true
          - otp: "28"
            elixir: "1.18"
            runtime_config: false

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v3

      - name: Set up Elixir environment
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install dependencies
        run: mix deps.get --only test

      - name: Run tests
        run: mix test
        env:
          STATIX_TEST_RUNTIME_CONFIG: ${{ matrix.runtime_config }}
